version: 2
updates:
  # Security and version updates for npm packages. Minor and patch bumps arrive in one grouped pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI runs Node 22 and Vercel runs Node 24, so types for Node 26 would allow APIs that do not exist on either.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet (lint breaks). Revisit when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
